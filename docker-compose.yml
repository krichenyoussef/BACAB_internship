services:
  pgvector:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: langchain
      POSTGRES_PASSWORD: langchain
      POSTGRES_DB: langchain
    ports:
      - "6024:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    env_file: .env
    environment:
      POSTGRES_CONNECTION_STRING: postgresql+psycopg://langchain:langchain@pgvector:5432/langchain
    ports:
      - "5125:5125"
    volumes:
      - ./data:/app/data
    depends_on:
      - pgvector

volumes:
  pgdata:
